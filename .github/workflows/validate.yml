name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        exclude:
          # Keep the macOS point load light: newest interpreter only.
          - os: macos-latest
            python: '3.10'
          - os: macos-latest
            python: '3.11'
          - os: macos-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e "mcp[dev]"
      - name: Compile Python sources
        run: python -m compileall -q mcp/src
      - name: Run tests with coverage
        run: pytest mcp/tests --cov=codex_kicad_mcp --cov-report=term-missing -q
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff check
        run: ruff check mcp/src mcp/tests mcp/scripts
      - name: Ruff format check
        run: ruff format --check mcp/src mcp/tests mcp/scripts

  type:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and mypy
        run: python -m pip install -e "mcp[dev]"
      - name: Mypy
        run: mypy mcp/src

  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "language:python"

  packaging:
    name: Package and install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build --sdist --wheel mcp
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: mcp/dist/
          if-no-files-found: error
      - name: Install wheel in a fresh virtualenv and import the entrypoint
        run: |
          python -m venv smoke
          smoke/bin/pip install mcp/dist/*.whl
          smoke/bin/python -c "from codex_kicad_mcp.server import main; print('wheel smoke ok')"

  metadata:
    name: Catalog and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate catalog and schema
        run: python scripts/validate_catalog.py
      - name: Check Markdown links
        run: python scripts/check_links.py
      - name: Check whitespace
        run: git diff --check

  release:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, type, packaging, metadata]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing; fall back to PYPI_TOKEN below
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build --sdist --wheel mcp
      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
      # Trusted publishing requires a one-time "pypi" environment configured
      # on GitHub.  When that is not yet set up (Step 12), publish with a
      # token instead by uncommenting these lines and adding PYPI_TOKEN to
      # the repository secrets:
      # - name: Publish via token
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   if: env.PYPI_TOKEN != ''
      #   with:
      #     password: ${{ secrets.PYPI_TOKEN }}
